<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen · Mensola</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f4f6; --card: #fff; --fg: #18181b; --dim: #6b6b75; --acc: #ff7a45; --line: #e4e4ea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --card: #1c1c20; --fg: #f2f2f4; --dim: #9a9aa5; --line: #2c2c33; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: var(--dim); font-size: 14px; margin-bottom: 18px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .size { color: var(--dim); font-size: 13px; font-weight: 400; display: block; }
  a.btn, label.btn { display: inline-block; background: var(--acc); color: #111; text-decoration: none; font-weight: 700; padding: 9px 14px; border-radius: 10px; font-size: 15px; cursor: pointer; }
  .empty { padding: 16px 14px; color: var(--dim); }
  .up { padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  input[type=file] { display: none; }
  .msg { font-size: 14px; color: var(--dim); }
  progress { width: 100%; height: 8px; }
</style>
</head>
<body>
<main>
  <h1>Mensola di Lumen</h1>
  <div class="sub">Il link funziona solo sulla stessa rete Wi-Fi del PC e scade dopo 10 minuti.</div>

  <h2>Dal PC al telefono</h2>
  <div class="card" id="files"><div class="empty">Caricamento…</div></div>

  <h2>Dal telefono al PC</h2>
  <div class="card up">
    <label class="btn" for="pick">Scegli foto o file</label>
    <input type="file" id="pick" multiple>
    <progress id="bar" max="1" value="0" hidden></progress>
    <div class="msg" id="msg">Finiscono nella mensola e in Download\Dal telefono sul PC.</div>
  </div>
</main>
<script>
  const base = location.pathname.replace(/\/$/, '');
  const fmt = (b) => { const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return b.toFixed(b < 10 && i ? 1 : 0) + ' ' + u[i]; };
  const box = document.getElementById('files');
  let last = '';
  async function load() {
    try {
      const r = await fetch(base + '/list.json', { cache: 'no-store' });
      if (!r.ok) throw new Error();
      const files = await r.json();
      const key = JSON.stringify(files);
      if (key === last) return;
      last = key;
      box.textContent = '';
      if (!files.length) { box.innerHTML = '<div class="empty">Nessun file sulla mensola. Trascinane uno sulla notch del PC.</div>'; return; }
      for (const f of files) {
        const row = document.createElement('div'); row.className = 'row';
        const n = document.createElement('div'); n.className = 'name'; n.textContent = f.name;
        const s = document.createElement('span'); s.className = 'size'; s.textContent = fmt(f.size); n.append(s);
        const a = document.createElement('a'); a.className = 'btn'; a.textContent = 'Scarica'; a.href = base + '/f/' + f.id; a.setAttribute('download', f.name);
        row.append(n, a); box.append(row);
      }
    } catch { box.innerHTML = '<div class="empty">Link scaduto o PC non raggiungibile. Genera un nuovo QR dalla notch.</div>'; last = ''; }
  }
  load(); setInterval(load, 3000);

  const msg = document.getElementById('msg'), bar = document.getElementById('bar');
  document.getElementById('pick').addEventListener('change', async (e) => {
    const files = [...e.target.files]; e.target.value = '';
    let ok = 0;
    for (const f of files) {
      msg.textContent = 'Invio di ' + f.name + '…'; bar.hidden = false; bar.value = 0;
      const done = await new Promise((res) => {
        const x = new XMLHttpRequest();
        x.open('PUT', base + '/up?name=' + encodeURIComponent(f.name));
        x.upload.onprogress = (p) => { if (p.lengthComputable) bar.value = p.loaded / p.total; };
        x.onload = () => res(x.status === 200); x.onerror = () => res(false);
        x.send(f);
      });
      if (done) ok++;
    }
    bar.hidden = true;
    msg.textContent = ok === files.length ? (ok === 1 ? 'Inviato.' : ok + ' file inviati.') : 'Inviati ' + ok + ' di ' + files.length + ': riprova per gli altri.';
    load();
  });
</script>
</body>
</html>

# Builds the Windows installer when a version tag (v0.4.0, ...) is pushed and publishes it
# as a GitHub Release, together with latest.json and the signatures used by Lumen's
# automatic updater. The signing key is the repository secret TAURI_SIGNING_PRIVATE_KEY.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --release

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lumen ${{ github.ref_name }}"
          releaseBody: "Installa scaricando Lumen_*_x64-setup.exe qui sotto. Chi ha già Lumen lo riceve in automatico."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
